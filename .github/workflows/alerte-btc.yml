name: Alerte BTC

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerte-btc
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier le prix
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_btc.py

      - name: Sauvegarder l'état
        run: |
          if [ -n "$(git status --porcelain etat.json)" ]; then
            git config user.name "btc-bot"
            git config user.email "btc-bot@users.noreply.github.com"
            git add etat.json
            git commit -m "Mise à jour état BTC"
            git push
          fi
